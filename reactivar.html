<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactivar Cuenta - LEIGSeguros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f0f2f5 0%, #dbe4f0 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .card-reactivar { width: 100%; max-width: 500px; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; background: white; text-align: center; }
        .icon-box { font-size: 3rem; color: #ffc107; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="card-reactivar">
        <div class="icon-box"><i class="fa-solid fa-lock-open"></i></div>
        <h2 class="fw-bold text-dark mb-3">Reactivar Cuenta</h2>
        <p class="text-muted mb-4">
            Tu cuenta está actualmente suspendida. Pulsa el botón para reactivarla y acceder de inmediato.
        </p>
        
        <div id="mensajeEstado" class="d-none alert"></div>

        <button id="btnReactivar" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
            <i class="fa-solid fa-power-off me-2"></i> REACTIVAR AHORA
        </button>
        
        <p class="mt-4 text-muted small">LEIGSeguros S.L.</p>
    </div>

    <script>
        document.getElementById('btnReactivar').addEventListener('click', async () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const btn = document.getElementById('btnReactivar');
            const msg = document.getElementById('mensajeEstado');

            if (!token) {
                msg.textContent = "Error: Enlace inválido (Falta el token).";
                msg.className = "alert alert-danger d-block";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner-border spinner-border-sm me-2"></div> Procesando...';

            try {
                // REUTILIZAMOS EL ENDPOINT DE CONFIRMACIÓN DE CUENTA
                // (Sirve igual porque busca el token y pone activo = true)
                const response = await fetch('http://localhost:8081/api/auth/confirm-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                if (response.ok) {
                    msg.textContent = "¡Cuenta activada! Redirigiendo al login...";
                    msg.className = "alert alert-success d-block";
                    btn.classList.add("d-none");
                    
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Vuelta al login
                    }, 2000);
                } else {
                    const texto = await response.text();
                    msg.textContent = "Error: " + texto;
                    msg.className = "alert alert-danger d-block";
                    btn.disabled = false;
                    btn.innerHTML = 'Intentar de nuevo';
                }
            } catch (error) {
                msg.textContent = "Error de conexión con el servidor.";
                msg.className = "alert alert-danger d-block";
                btn.disabled = false;
                btn.innerHTML = 'Intentar de nuevo';
            }
        });
    </script>

</body>
</html>
